# Server Configuration
server.port=8080

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_db?currentSchema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# HikariCP Connection Pool (tối ưu cho blocking I/O bọc trong RxJava Schedulers.io)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Khởi tạo Schema (nếu chưa dùng Flyway)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Xóa / Tắt H2 Console
spring.h2.console.enabled=false

# jOOQ Dialect chuyển sang POSTGRES
spring.jooq.sql-dialect=POSTGRES

# Logging
logging.level.org.jooq=INFO
logging.level.vn.tnteco.demo=DEBUG
